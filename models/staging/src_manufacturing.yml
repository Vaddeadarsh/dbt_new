version: 2

sources:
  - name: raw_mfg
    description: "Original raw analytical tracking datasets landed inside the Snowflake RAW compute schemas."
    database: Manufacturing360
    schema: RAW

    tables:

      - name: products
        description: "Raw items ledger ingested directly from master Parquet sheets."

        #config:
        #  loaded_at_field: CREATED_AT
        #  freshness:
        #    warn_after: {count: 48, period: hour}
        #    error_after: {count: 96, period: hour}

        columns:
          - name: product_id
            description: "Primary identifier for each product SKU."
            tests:
              - unique
              - not_null

          - name: product_name
            description: "Name of the product."

          - name: category
            description: "Product category classification."

      - name: suppliers
        description: "Landed semi-structured nested JSON supplier manifest variant blocks."

        #config:
        #  loaded_at_field: "CAST(updated_at AS TIMESTAMP)"
        #  freshness:
        #    warn_after: {count: 48, period: hour}
        #    error_after: {count: 96, period: hour}

        columns:
          - name: supplier_id
            description: "Primary identifier for supplier."
            tests:
              - unique
              - not_null

          - name: supplier_name
            description: "Name of the supplier."

          - name: supplier_status
            description: "Operational status of supplier."
           
      - name: machines
        description: "Raw data rows documenting industrial machine availability."

        #config:
        #  loaded_at_field: LAST_MAINTENANCE_DATE
        #  freshness:
        #    warn_after: {count: 24, period: hour}
        #    error_after: {count: 72, period: hour}

        columns:
          - name: machine_id
            description: "Primary identifier for machine."
            tests:
              - unique
              - not_null

          - name: machine_type
            description: "Type/category of machine."

          - name: status
            description: "Machine operational status."
            tests:
              - accepted_values:
                  arguments:
                    values: ['Active', 'Idle', 'Maintenance']

      - name: inventory
        description: "Warehouse stock balance tracking file logs."

        #config:
        #  loaded_at_field: last_updated
        #  freshness:
        #    warn_after: {count: 24, period: hour}
        #    error_after: {count: 48, period: hour}

        columns:
          - name: inventory_id
            description: "Primary identifier for inventory record."
            tests:
              - unique
              - not_null

          - name: product_id
            description: "Reference to product in inventory."
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw_mfg', 'products')
                    field: product_id

          - name: quantity
            description: "Available stock quantity."
           

      - name: production
        description: "Shopfloor manufacturing process run logs records."

        #config:
        #  loaded_at_field: start_date
        #  freshness:
        #    warn_after: {count: 12, period: hour}
        #    error_after: {count: 24, period: hour}

        columns:
          - name: production_order_id
            description: "Primary identifier for production orders."
            tests:
              - unique
              - not_null

          - name: product_id
            description: "Product being manufactured."
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw_mfg', 'products')
                    field: product_id

          - name: machine_id
            description: "Machine used for production."
            tests:
              - relationships:
                  arguments:
                    to: source('raw_mfg', 'machines')
                    field: machine_id

          - name: quantity_produced
            description: "Number of units produced."
            

      - name: shipments
        description: "Carrier dispatch log transit data files."

        #config:
        #  loaded_at_field: shipment_date
        #  freshness:
        #    warn_after: {count: 24, period: hour}
        #    error_after: {count: 72, period: hour}

        columns:
          - name: shipment_id
            description: "Primary identifier for shipment."
            tests:
              - unique
              - not_null

          - name: product_id
            description: "Product being shipped."
            tests:
              - relationships:
                  arguments:
                    to: source('raw_mfg', 'products')
                    field: product_id

          - name: status
            description: "Current shipment status."
            tests:
              - accepted_values:
                  arguments:
                    values: ['Delayed', 'In Transit', 'Delivered']